<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Synapse - 10 Levels</title>




    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #222; 
            font-family: 'Silkscreen', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas { 
            display: block; 
            touch-action: none;
        }
    </style>




</head>
<body>
    <canvas id="gameCanvas"></canvas>




    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let audioCtx;
        function playTone(frequency, duration, type = 'square') {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = type;
            oscillator.frequency.value = frequency;
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            oscillator.stop(audioCtx.currentTime + duration);
        }






        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            draw();
        }
        window.addEventListener('resize', resize);

        const levelTargets = [500, 450, 400, 350, 310, 270, 240, 210, 190, 180];
        let currentLevel = 1;
        let maxLevels = 10;
        
        let state = 'start'; 
        let startTime = 0;
        let timeoutId = null;
        let reactionTime = 0;

        function draw() {
            if (state === 'start' || state === 'passed' || state === 'win') {
                ctx.fillStyle = '#2b87d1'; 
            } else if (state === 'waiting') {
                ctx.fillStyle = '#ce2727'; 
            } else if (state === 'ready') {
                ctx.fillStyle = '#4caf50'; 
            } else if (state === 'early' || state === 'failed') {
                ctx.fillStyle = '#b71c1c'; 
            }
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const fontName = '"Silkscreen", sans-serif';






            if (state === 'waiting' || state === 'ready') {
                ctx.font = `20px ${fontName}`;
                ctx.textAlign = 'left';
                ctx.fillText(`Level: ${currentLevel}/${maxLevels}`, 20, 30);
                ctx.textAlign = 'right';
                ctx.fillText(`Target: ${levelTargets[currentLevel-1]}ms`, canvas.width - 20, 30);
                ctx.textAlign = 'center'; 
            }

            if (state === 'start') {
                ctx.font = `40px ${fontName}`;
                ctx.fillText('SYNAPSE', centerX, centerY - 40);
                ctx.font = `20px ${fontName}`;
                ctx.fillText('10 Levels. Get faster every round.', centerX, centerY);
                ctx.fillText('Click or press Space to start Level 1', centerX, centerY + 50);
            } 
            else if (state === 'waiting') {
                ctx.font = `30px ${fontName}`;
                ctx.fillText('Wait for green...', centerX, centerY);
            } 
            else if (state === 'ready') {
                ctx.font = `60px ${fontName}`;
                ctx.fillText('CLICK!', centerX, centerY);
            } 
            else if (state === 'passed') {
                ctx.font = `40px ${fontName}`;
                ctx.fillText('LEVEL CLEARED', centerX, centerY - 40);
                ctx.font = `20px ${fontName}`;
                ctx.fillText(`Time: ${reactionTime} ms`, centerX, centerY + 10);
                ctx.fillText(`Click to start Level ${currentLevel}`, centerX, centerY + 50);
            } 
            else if (state === 'failed') {
                ctx.font = `40px ${fontName}`;
                ctx.fillText('TOO SLOW', centerX, centerY - 40);
                ctx.font = `20px ${fontName}`;
                ctx.fillText(`Time: ${reactionTime} ms | Target: ${levelTargets[currentLevel-1]} ms`, centerX, centerY + 10);
                ctx.fillText('Click to restart from Level 1', centerX, centerY + 50);
            } 
            else if (state === 'early') {
                ctx.font = `40px ${fontName}`;
                ctx.fillText('FALSE START', centerX, centerY - 40);
                ctx.font = `20px ${fontName}`;
                ctx.fillText('You clicked before green!', centerX, centerY + 10);
                ctx.fillText('Click to restart from Level 1', centerX, centerY + 50);
            }
            else if (state === 'win') {
                ctx.font = `40px ${fontName}`;
                ctx.fillText('SYSTEM DEFEATED', centerX, centerY - 40);
                ctx.font = `20px ${fontName}`;
                ctx.fillText('You beat all 10 levels!', centerX, centerY + 10);
                ctx.fillText('Click to play again', centerX, centerY + 50);
            }
        }










        function handleClick(e) {
     
            if (e && e.button !== undefined && e.button !== 0) return;

            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            if (state === 'start' || state === 'passed') {
                state = 'waiting';
                draw();
                
                const delay = Math.floor(Math.random() * 3000) + 1500;
                
                timeoutId = setTimeout(() => {
                    state = 'ready';
                    startTime = Date.now();
                    playTone(880, 0.1); 
                    draw();
                }, delay);

            } else if (state === 'failed' || state === 'early' || state === 'win') {
                currentLevel = 1;
                state = 'start';
                draw();

            } else if (state === 'waiting') {
                clearTimeout(timeoutId);
                state = 'early';
                playTone(150, 0.3, 'sawtooth'); 
                draw();

            } else if (state === 'ready') {
                reactionTime = Date.now() - startTime;
                const target = levelTargets[currentLevel - 1];

                if (reactionTime <= target) {
                    if (currentLevel === maxLevels) {
                        state = 'win';
                        playTone(1200, 0.4); 
                    } else {
                        currentLevel++;
                        state = 'passed';
                        playTone(600, 0.2); 
                    }
                } else {
                    state = 'failed';
                    playTone(150, 0.4, 'sawtooth'); 
                }
                draw();
            }
        }








        window.addEventListener('pointerdown', handleClick);

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') {
                e.preventDefault(); 
                handleClick();
            }
        });

        document.fonts.load('10px "Silkscreen"').then(() => {
            resize();
        }).catch(() => {
            resize();
        });
    </script>




</body>
</html>
